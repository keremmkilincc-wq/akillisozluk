name: akilli_sozluk
description: "Akıllı Türkçe Sözlük ve Dil Asistanı"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter

  # Tipografi
  google_fonts: ^6.2.1

  # Durum yönetimi
  provider: ^6.1.2

  # Sesli telaffuz (Faz 1)
  flutter_tts: ^4.2.0

  # Favoriler ve kişisel listeler (Modül 7)
  shared_preferences: ^2.3.2

  # Sözlük veritabanı — TEK doğru kaynak (Faz 0'dan itibaren)
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # Testler de AYNI SQLite yolunu dener. JSON'dan okumak gerçek davranışı
  # test etmezdi — üretim hattı JSON'a değil SQLite'a yazıyor.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
  assets:
    # dict.db uygulamanın tek sözlük kaynağı.
    # (ÖNEMLİ: buraya eklenmezse APK'ya giremez, repoda olması yetmez —
    #  bu hata projede bir kez yapıldı ve düzeltildi.)
    - assets/dict.db
    # Wordle kelime listesi — tools/build_wordle.py URETIR, elle yazilir.
    # Bu varlik olmadan oyun acilmaz.
    - assets/data/wordle_clean.json